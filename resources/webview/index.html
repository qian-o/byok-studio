<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP_SOURCE}} data:; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}'; font-src {{CSP_SOURCE}};">
  <meta name="color-scheme" content="light dark">
  <title>{{t:模型设置 · BYOK Studio}}</title>
  <link rel="stylesheet" href="{{resource:webview/style.css}}">
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 4v6h-6M20 10a8 8 0 1 0-1 8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M3 21l5-1L21 7l-5-5L3 15v6Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
  </defs></svg>
  <main class="page" id="studio" aria-busy="true">
    <header class="page-header">
      <h1>{{t:模型设置}}</h1>
      <div class="header-actions">
        <button id="import-providers" class="header-action" type="button" disabled><svg aria-hidden="true"><use href="#i-import"/></svg>{{t:导入}}</button>
        <button id="export-providers" class="header-action" type="button" disabled><svg aria-hidden="true"><use href="#i-export"/></svg>{{t:导出}}</button>
      </div>
    </header>
    <div id="loading-state" class="notice" role="status">{{t:正在加载配置…}}</div>
    <div id="load-error" class="notice error-notice" role="alert" hidden><span id="load-error-message"></span><button id="retry-state" class="button secondary small" type="button" data-initial-action>{{t:重新加载}}</button></div>
    <div id="update-banner" class="notice update-notice" role="status" hidden><span>{{t:配置已在其他位置更新，当前草稿已保留。}}</span><button id="reload-state" class="button secondary small" type="button">{{t:重新载入}}</button></div>
    <div class="settings-card" id="settings-card" hidden>
      <div class="provider-navigation" aria-label="{{t:供应商管理}}">
        <h2>{{t:供应商}}</h2>
        <nav id="provider-list" aria-label="{{t:供应商列表}}"></nav>
        <button class="add-provider" id="add-provider" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>{{t:添加供应商}}</button>
      </div>
      <section id="provider-panel" class="provider-panel" aria-label="{{t:供应商设置}}" hidden>
        <form id="provider-form" novalidate autocomplete="off">
          <div class="form-grid">
            <div class="field compact-field"><label for="provider-name">{{t:名称}}</label><input id="provider-name" maxlength="200" placeholder="{{t:供应商名称}}" autocomplete="off" required></div>
            <div class="field compact-field">
              <label for="api-key">API Key</label>
              <input id="api-key" type="password" maxlength="16000" placeholder="{{t:输入 API Key（可选）}}" autocomplete="off" spellcheck="false">
            </div>
            <div id="unified-endpoint" class="unified-endpoint">
              <div class="field compact-field"><label for="unified-api-type">{{t:协议}}</label><select id="unified-api-type"><option value="chatCompletions">Chat Completions</option><option value="responses">Responses</option><option value="messages">Messages</option></select></div>
              <div class="field compact-field"><label for="unified-url">Base URL</label><input id="unified-url" type="url" maxlength="4096" placeholder="https://api.example.com/v1" spellcheck="false" autocomplete="off"></div>
            </div>
            <div class="provider-options">
              <fieldset class="plain-fieldset routing-mode"><legend class="visually-hidden">{{t:协议模式}}</legend><div class="segmented-control"><label><input id="routing-unified" type="radio" name="routing-mode" value="unified"><span>{{t:统一协议}}</span></label><label><input id="routing-split" type="radio" name="routing-mode" value="split"><span>{{t:区分协议}}</span></label></div></fieldset>
            </div>
          </div>
          <section class="model-box" aria-labelledby="models-heading">
            <header class="model-box-header">
              <div class="model-heading"><h3 id="models-heading">{{t:模型}}</h3><span id="model-total" class="model-total"></span></div>
              <label id="unified-model-selection" class="checkbox compact"><input id="select-all-unified" type="checkbox" data-select-all="unified" aria-label="{{t:全选模型}}">{{t:全选}}</label>
              <div class="model-header-actions"><button id="delete-selected-models" class="button secondary small delete-models" type="button" hidden>{{t:删除}}</button><button id="refresh-models" class="button secondary small" type="button"><svg aria-hidden="true"><use href="#i-refresh"/></svg><span id="refresh-models-label">{{t:刷新}}</span></button><button id="add-model" class="button primary small" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>{{t:添加模型}}</button></div>
            </header>
            <div id="model-list" class="model-list" role="region" aria-labelledby="models-heading" tabindex="-1"></div>
          </section>
          <p id="provider-error" class="inline-error" role="alert" hidden></p>
          <footer class="panel-footer"><button id="delete-provider" class="button delete-provider" type="button">{{t:删除供应商}}</button><button id="save-provider" class="button primary" type="submit">{{t:保存供应商}}</button></footer>
        </form>
      </section>
      <section id="empty-provider" class="empty-provider" hidden><p>{{t:添加供应商，开始配置你的模型。}}</p><button id="empty-add" class="button primary" type="button">{{t:添加供应商}}</button></section>
    </div>
    <p id="request-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <dialog id="model-dialog" aria-labelledby="model-title">
    <form id="model-form" class="dialog-scroll" novalidate>
      <header class="dialog-header"><h2 id="model-title">{{t:添加模型}}</h2><button class="icon-button" type="button" data-close="model-dialog" aria-label="{{t:关闭模型设置}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
      <div class="model-fields">
        <div class="field"><label for="model-name">{{t:显示名称}}</label><input id="model-name" maxlength="200" autocomplete="off" required></div>
        <div class="field"><label for="model-id">{{t:请求模型 ID}}</label><input id="model-id" maxlength="512" list="model-id-options" spellcheck="false" autocomplete="off" required><datalist id="model-id-options"></datalist></div>
        <div id="model-protocol-field" class="field"><label for="model-protocol">{{t:请求协议}}</label><select id="model-protocol"><option value="chatCompletions">Chat Completions</option><option value="responses">Responses</option><option value="messages">Messages</option></select></div>
        <p id="model-update" class="notice compact-notice" role="status" hidden>{{t:配置已在其他位置更新。当前编辑内容已保留，请在保存供应商前检查。}}</p>
        <div class="token-fields"><div class="field"><label for="context-window">Context</label><input id="context-window" type="number" min="2" max="100000000" step="1" required></div><div class="field"><label for="max-output">Output</label><input id="max-output" type="number" min="1" max="100000000" step="1" required></div></div>
        <fieldset class="plain-fieldset"><legend>{{t:模型能力}}</legend><div class="capabilities"><label class="checkbox"><input id="cap-tools" type="checkbox">{{t:工具调用}}</label><label class="checkbox"><input id="cap-vision" type="checkbox">{{t:视觉}}</label><label class="checkbox"><input id="cap-thinking" type="checkbox">{{t:思考}}</label></div></fieldset>
        <fieldset class="plain-fieldset"><legend>{{t:可用推理档位}}</legend><div id="effort-options" class="efforts"></div></fieldset>
        <div class="field"><label for="reasoning-effort">{{t:推理强度}}</label><select id="reasoning-effort"><option value="">{{t:默认（不指定）}}</option></select></div>
      </div>
      <p id="model-error" class="dialog-error" role="alert" hidden></p>
      <footer class="dialog-footer"><button class="button secondary" type="button" data-close="model-dialog">{{t:取消}}</button><button id="apply-model" class="button primary" type="submit">{{t:添加}}</button></footer>
    </form>
  </dialog>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <div class="dialog-scroll">
      <header class="dialog-header"><h2 id="export-title">{{t:导出供应商}}</h2><button class="icon-button" type="button" data-close="export-dialog" aria-label="{{t:关闭导出}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
      <div class="transfer-toolbar">
        <label class="checkbox"><input id="export-select-all" type="checkbox" checked>{{t:全选}}</label>
      </div>
      <div id="export-provider-list" class="transfer-list" role="group" aria-labelledby="export-title"></div>
      <p id="export-error" class="dialog-error" role="alert" hidden></p>
      <footer class="dialog-footer">
        <button id="export-clipboard" class="button secondary" type="button">{{t:复制到剪贴板}}</button>
        <button id="export-file" class="button primary" type="button">{{t:导出 JSON 文件}}</button>
      </footer>
    </div>
  </dialog>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <div class="dialog-scroll">
      <header class="dialog-header"><h2 id="import-title">{{t:导入供应商}}</h2><button class="icon-button" type="button" data-close="import-dialog" aria-label="{{t:关闭导入}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
      <div class="import-sources">
        <button id="import-from-clipboard" class="button secondary small" type="button">{{t:从剪贴板读取}}</button>
        <button id="import-from-file" class="button secondary small" type="button">{{t:选择 JSON 文件}}</button>
      </div>
      <div id="import-selection-section" hidden>
        <div class="transfer-toolbar">
          <label class="checkbox"><input id="import-select-all" type="checkbox" checked>{{t:全选}}</label>
          <span id="import-summary" class="source-note"></span>
        </div>
        <div id="import-provider-list" class="transfer-list" role="group" aria-labelledby="import-title"></div>
      </div>
      <p id="import-empty" class="empty-models">{{t:从剪贴板读取或选择导出的 JSON 文件以预览供应商。}}</p>
      <p id="import-error" class="dialog-error" role="alert" hidden></p>
      <footer class="dialog-footer">
        <button id="apply-import" class="button primary" type="button" disabled>{{t:导入所选}}</button>
      </footer>
    </div>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="dialog-scroll">
    <header class="dialog-header"><h2 id="confirm-title">{{t:确认操作}}</h2><button class="icon-button" type="button" data-close="confirm-dialog" aria-label="{{t:关闭确认}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
    <p id="confirm-message" class="dialog-copy"></p>
    <footer class="dialog-footer"><button id="confirm-cancel" class="button secondary" type="button" data-close="confirm-dialog">{{t:取消}}</button><button id="confirm-action" class="button primary" type="button">{{t:确认}}</button></footer>
    </div>
  </dialog>
  <div id="toast" class="toast error-toast" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>
  <script nonce="{{NONCE}}" src="{{resource:shared/messages.en.js}}"></script>
  <script nonce="{{NONCE}}" src="{{resource:shared/i18n.js}}"></script>
  <script nonce="{{NONCE}}" src="{{resource:shared/routing.js}}"></script>
  <script nonce="{{NONCE}}" src="{{resource:shared/model-policy.js}}"></script>
  <script nonce="{{NONCE}}" src="{{resource:webview/app.js}}"></script>
</body>
</html>
